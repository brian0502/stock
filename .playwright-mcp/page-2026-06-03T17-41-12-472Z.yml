                      - text: COMPUTEX一開台股就噴新高！記憶體暴走南亞科首闖400元大關｜Yahoo財經掃描
                  - paragraph [ref=e822]: 輝達搶進AI PC，帶動相關軟硬體類股全面強漲，抵銷美伊和談烏雲罩頂、推升油價的利空，美國四大指數全面刷新收盤新高。科技股表現方面，輝達發表AI PC新晶片、並與微軟合作重塑Windows PC體驗，帶動輝達股價大漲6.3%、微軟上漲2.3%，戴爾、惠普等AI PC概念股同步受惠，顯示資金仍圍繞AI運算、個人電腦升級與軟硬體生態系布局；台積電ADR則大漲4.11%。再創新天價。 亞股方面，日股下跌0.30%；韓股小漲0.15%，收8,801.49點並再創收盤新高；港股強漲2.52%，收26,038.32點；上證指數上漲約0.43%，收4,075.10點，亞股在美股創高激勵下仍以科技與資金行情為盤面焦點。 回到台股，台股今(2)日延續AI題材與權值股買盤，終場上漲219.40點、漲幅0.48%，收45,557.31點，再創收盤新高，盤中最高一度來到45,915.92點，也一度震盪翻黑，成交金額1兆6095.95億元；不過櫃買指數下跌5.38點，收440.64點，顯示中小型股相對轉弱、資金更集中大型權值股。權王台積電(2330)再度扛起大旗，終場上漲25元、收2380元，漲幅1.06%，穩居成交值焦點，也成為推升大盤續創高的重要力量。盤面表現方面，電子指數上漲11.11點，金融指數上漲59.47點，電子權值與金融股同步撐盤；AI PC、伺服器與COMPUTEX題材延燒，多檔AI供應鏈持續吸引資金關注，面板雙雄也因低價轉機與資金輪動題材買賣熱絡，記憶體族群也表現強勢，南亞科(2408)400元達陣，華邦電(2344)、威剛(3260)同步漲停，整體來看，台股雖再創高，後續仍須觀察AI題材續航力與成交量能是否維持高檔。
