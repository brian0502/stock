                      - text: 南亞科5月營收276億元創新高 年增730%
                  - paragraph [ref=e626]: （中央社記者張建中台北2026年6月3日電）動態隨機存取記憶體（DRAM）廠南亞科(2408)5月營收持續攀高，達到新台幣276.7億元，年增730.14%，超越4月的254.91億元，再創歷史新高。南亞科自結5月營收276.7億元，月增8.55%，年增730.14%。4月和5月營收合計達531.61億元，已超越第1季營收490.87億元。南亞科累計前5月營收突破1000億元大關，達到1022.48億元，較去年同期增加649.62%，並已超越2024年和2025年兩年合計營收。南亞科表示，市場需求成長驅動營收創高。南亞科先前指出，DRAM市場供不應求，預期市場供需缺口可能延續到明年底。新廠預計明年開始裝機，明年底至後年將貢獻產出，估計會增加3萬多片，2到3年後南亞科產能將比目前增加80%至100%。
