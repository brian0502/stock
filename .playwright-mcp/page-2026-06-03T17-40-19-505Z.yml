                      - text: 國泰永續高股息規模突破6000億，新增長榮等5檔成分股，刪除遠東新等4檔
                  - paragraph [ref=e740]: 【財訊快報／記者劉居全報導】國泰永續高股息(00878)基金規模自4月底以來大幅成長近24%，突破6000億元大關，淨值突破32元創下自身新高，繼續坐穩全台最大ESG基金地位。依據MSCI指數公司資訊，00878所追蹤的「MSCI臺灣ESG永續高股息精選30指數」，近期進行例行指數調整，已於6月1日生效，成分股新增5檔，分別為長榮(2603)、長榮航(2618)、華南金(2880)、台新新光金(2887)、統一超(2912)；刪除4檔為遠東新(1402)、仁寶(2324)、可成(2474)、京元電子(2449)；近期備受矚目的廣達(2382)、聯電(2303)、聯發科(2454)、華碩(2357)等輝達背板股仍在00878持股名單中。國泰永續高股息基金經理人江宇騰表示，00878追蹤指數「MSCI臺灣ESG永續高股息精選30指數」每半年會進行例行性調整持股，目的在於維持該指數向來具備產業相對分散與低周轉率的特性，本次新增的5檔標的係因股利分數達標而被納入；其中刪除股遠東新、仁寶、可成，則因被母指數「MSCI台灣指數」剔除，故本次同步刪除，此外京元電子則因股利分數未達標而剔除；MSCI臺
