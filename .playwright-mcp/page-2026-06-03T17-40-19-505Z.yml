                  - paragraph [ref=e580]: MoneyDJ新聞 2026-06-03 11:25:10 黃立安 發佈今年COMPUTEX話題離不開AI PC，隨著輝達(NVIDIA)與聯發科(2454)共同開發的N1X處理器正式亮相，被市場視為直接挑戰高通(Qualcomm)在Windows on Arm陣營的地位。高通資深副總裁暨運算與遊戲部門總經理Kedar Kondap受訪時表示，樂見更多合作夥伴加入Windows on Arm生態系。同時高通也在COMPUTEX展前推出全新入門級平台Snapdragon C鎖定300美元以上筆電市場，在N1X搶攻高階AI PC之際，進一步向下擴大Arm PC版圖。 針對Windows on Arm市占率是否有機會持續擴大，以及N1X加入後帶來的競爭態勢，Kedar Kondap表示，高通歡迎更多合作夥伴加入，這對整個Windows on Arm生態系而言是正向發展。 除高階AI PC競爭升溫外，高通此次則選擇推出入門級處理器Snapdragon C。在記憶體價格上漲、供應鏈優先推動高階產品的環境下，為何高通仍選擇切入入門市場？Kedar Kondap回應，PC市場本來就存在不同價位帶需求
