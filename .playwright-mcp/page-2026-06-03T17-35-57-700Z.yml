                      - text: 外資銀彈灌神山鎖2015元新高 台股噴出9840億天量/群創百萬張成交炸裂 台塑四寶大反攻/勞退紅利怎麼領最聰明 專家來解答｜Yahoo財經掃描
                  - paragraph [ref=e402]: 在Meta與AMD深化合作、軟體股反彈帶動下，美股科技巨頭氣氛回暖，推升主要指數同步收高。四大指數全面走揚，道瓊工業指數上漲0.76%，那斯達克指數上漲1.04%，標普500指數上漲0.77%，費城半導體指數大漲1.45%並創歷史收盤新高，其中AMD大漲帶動半導體族群轉強，軟體類股亦在AI新創動態後反彈，市場解讀AI需求仍為長線主軸；台積電ADR同步勁揚約4.25%，續寫新高，成為台股多頭重要風向球。 亞股方面延續強勢氣氛，日股上漲2.20%，韓股同步強漲1.91%，站上史上首見的6000點；港股恒生指數上漲0.45%，陸股小漲0.72%，區域市場呈現普遍偏多格局。 回到台股，今（25）日加權指數大漲712.25點，收在35,413.07點，成交金額達9,840.13億元創新天量，顯示市場交投火熱。權值股方面，台積電(2330)延續ADR強勢，盤中衝出新高2025元，收盤強鎖2015元新高價，成為指數攻高最大推手；盤面資金集中電子與AI相關族群，台達電(2308)續創新高，鴻海(2317)、廣達(2382)漲幅亮眼，同時塑化族群在景氣復甦預期下同步走強；熱門成交股則由面板雙虎領軍，搭配記憶體與材料族群輪動，顯示市場資金持續聚焦高話題族群推升盤勢。
