                      - text: 外資大砍726億 台積電領跌大盤跳水/面板雙虎爆量百萬張 觀光股吸金撐盤/金銀暴漲暴跌誰在推？中國大媽掃貨掀大浪｜Yahoo財經掃描
                  - paragraph [ref=e512]: 受AMD財測不佳拖累，資金撤出AI與半導體族群，AI科技股賣壓再起，美股四大指數走勢分歧。那斯達克指數下跌1.51%、標普500指數下挫0.51%、費城半導體指數重挫4.36%，僅道瓊工業指數挺住收漲0.53%。個股方面，AMD重挫17.31%成為盤面焦點，輝達下跌3.41%、美光大跌9.55%、博通下挫3.83%，台積電ADR也回落2.98%，科技權值走弱拖累大盤氣氛。 亞股方面跟隨美股偏弱，日經指數下跌0.88%、韓股持續走弱重挫3.86%；港股小幅走揚0.07%，上海綜合指數下跌0.64%，區域股市漲跌互見。 回到台股，加權指數終場下跌488.54點，收在31,801.27點，成交金額6,913.59億元，量能仍維持高檔；權王台積電(2330)受國際半導體賣壓影響走弱，拖累指數表現，盤面以題材與族群輪動為主，面板、記憶體以及太空題材成交持續熱絡，金融族群如富邦金(2881)、中信金(2891)等表現相對抗跌，但整體仍籠罩在電子股賣壓之下。
