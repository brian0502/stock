                      - text: 面板記憶體齊亮 群創旺宏人氣旺/不是科技也能市值破兆 沃爾瑪示範給台股看/星鏈想像空間大開 太空概念股繼續飛｜Yahoo財經掃描
                  - paragraph [ref=e532]: 美國市場一邊憂心AI工具競爭加劇壓縮軟體與資訊服務商獲利空間，一邊觀望科技巨擘產業前景，拖累美股四大指數震盪收低。道瓊工業指數下跌0.34%、那斯達克指數回落1.43%、標普500指數下挫0.84%，費城半導體指數跌幅達2.07%，科技與半導體族群成為主要壓力來源。盤面上，輝達、微軟、Meta等大型科技股同步回檔，Google與Amazon在財報前也出現修正；半導體類股方面，英特爾在談及AI與GPU布局後小幅走揚，但輝達與超微同步承壓。台積電ADR隨費半走弱而回檔1.64%，成為拖累美股科技盤勢的關鍵之一。 亞股方面，日股從高點回落，下跌0.78%；韓股延續強勢，上漲1.57％續創新高；港股與陸股則小幅走揚，區域股市走勢分歧。 回到台股，加權指數終場上漲94.45點，收在32,289.81點，漲幅0.29%，成交金額6,863.3億元，量能雖縮減但仍維持在相對高檔。權王台積電(2330)受ADR回落影響，股價下挫15元；盤面焦點轉向題材與族群輪動，低軌衛星概念股持續吸引資金，面板雙雄攜手走揚，表現亮眼；記憶體族群受南亞科營收利多帶動，受到市場青睞。整體而言，在美股震盪、亞股分歧的背景下，台股展現相對韌性，資金聚焦具題材與基本面支撐的族群輪動。
