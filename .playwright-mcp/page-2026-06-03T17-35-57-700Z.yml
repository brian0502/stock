                  - paragraph [ref=e446]: AI與科技股近期缺乏明確主流題材帶領，再加上零售銷售表現較預期疲弱，市場靜待其他關鍵經濟數據出爐，使美股投資氣氛轉趨保守。道瓊指數上漲0.10%，連續三日創歷史收盤新高；那斯達克指數下跌0.59%，標普500指數下跌0.33%，費城半導體指數下跌0.68%。盤面上，零售數據疲弱拖累好市多與沃爾瑪走低，而AI財富管理工具題材引發市場重新評價，LPL Financial、嘉信理財等財富顧問股大跌逾7%，Alphabet因發債消息亦承壓；台積電ADR則延續強勢上漲1.83%，連三日創高，反映半導體族群基本面支撐仍在。 亞股方面，區域市場整體維持偏多格局，日股因建國紀念日休市一天；韓股上漲0.99%，港股上漲0.31%，上證指數小漲，顯示資金情緒仍偏正向但追價力道略為不足。 回到台股，今（11）日大盤迎向蛇年封關，在權值股帶動下強勢收高，加權指數大漲532.74點、收33,605.71點，再刷新歷史新高，成交金額6,757.96億元，周線同步收紅。權王台積電(2330)盤中一度衝上1925元歷史天價，終場收1915元，成為推升指數最關鍵力量；資金集中電子權值與AI供應鏈，鴻海(2317)、台達電(2308)、聯發科(2454)同步走揚，題材股方面富喬(1815)受納入MSCI小型指數激勵攻上漲停，記憶體族群放量強勢，電子、金融、傳產等輪動盤面熱度，也為蛇年全年行情合計萬點漲幅劃下亮眼句點。
