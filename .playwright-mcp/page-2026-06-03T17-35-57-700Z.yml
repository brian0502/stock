                      - text: 台股一度飆逾千點 台積電叩關2000元/記憶體夯過年！力積電爆量飆漲停/矽光子「瘋馬行情」多檔亮燈漲停｜Yahoo財經掃描
                  - paragraph [ref=e426]: AI代理人技術快速演進衝擊軟體產業既有商業模式，加上川普關稅政策不確定性升溫，市場避險情緒升高，拖累科技與金融族群走弱。在此背景下，美股四大指數全面收黑，道瓊工業指數下跌1.66%，那斯達克指數下跌1.13%，標普500指數下跌1.04%，費城半導體指數下跌0.57%。受AI新創Anthropic推出Claude Opus 4.6模型影響，投資人憂心軟體服務價值遭重塑，IBM重挫13.15%，創下2000年以來最大單日跌幅，微軟等軟體股同步承壓，金融股如美國運通、Mastercard與Visa亦重挫。 亞股方面則相對強勢，日股連休後回補上漲0.87%；韓股亦上漲2.11%，延續高檔動能；港股則下挫1.82%，陸股小漲。區域市場資金仍偏多，與美股走勢形成分歧。 回到台股，今（25）日加權指數強勢上攻，盤中衝出34,376點歷史新高，一度漲逾千點，終場收漲927點，成交金額約8383.7億元，量能維持高檔。權值股方面，台積電(2330)大漲並觸及1,975元歷史高點，持續扮演指數上攻關鍵；盤面資金集中電子與AI題材，台達電(2308)強勢走揚，日月光投控(3711)漲幅亮眼，記憶體族群吸引買盤，矽光子、玻纖布同步強攻，多檔ETF也因高含積量題材交投活絡。整體而言，在外資回補與權值股領軍下，台股呈現量價齊揚、多頭齊發的格局。
