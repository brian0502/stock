                  - paragraph [ref=e492]: Alphabet上修AI資本支出、引爆市場對「燒錢換成長」的疑慮，資金轉趨保守，加上比特幣急挫、貴金屬再現劇烈震盪，拖累美股四大指數同步走弱；道瓊下跌1.20%、那斯達克下跌1.59%、標普500指數下跌1.23%、費城半導體指數小跌0.06%，科技股賣壓下亞馬遜、微軟等AI權值股承壓，輝達也回落，而台積電ADR則逆勢上漲1.53%，意外成盤面亮點。 亞股方面漲跌互見，日股上漲0.81%，韓股則下挫1.44%，指數仍守在5千點大關以上；港股下跌1.16%，上證指數小跌0.25%，區域市場氣氛偏保守。 回到台股，加權指數終場小跌18.35點、收31,782.92點，成交金額6,780.75億元，周線止步連六紅翻黑；權王台積電(2330)逆勢走揚15元、收1,780元成「神隊友」穩盤，資金轉向具題材與避風港屬性個股，權值股日月光投控(3711)、台達電(2308)等相對抗跌走強，記憶體與面板族群交易也維持熱度，凸顯多空激戰下的輪動格局。
