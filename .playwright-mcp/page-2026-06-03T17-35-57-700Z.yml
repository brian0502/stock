                  - paragraph [ref=e468]: AI晶片與軟體股在歷經前波修正後回神，市場對企業AI資本支出與算力需求前景轉趨樂觀，加上分析師上修評等帶動資金回流科技族群，激勵美股四大指數全面收紅，道瓊上漲0.04%，連兩日創歷史收盤新高，那斯達克上漲0.90%，標普500指數上漲0.47%，費城半導體指數上漲1.42%。盤面個股表現，甲骨文獲調升評等強彈逾9%，帶動微軟等軟體股同步走高，輝達、博通、超微等AI晶片股漲幅均逾2%，顯示市場重新聚焦AI長線動能；不過在非農就業與CPI等關鍵經濟數據公布前，投資人態度仍偏謹慎，聯準會降息時程預期維持觀望。台積電ADR同步走強1.88%，延續半導體族群多頭氣氛。 亞股方面延續偏多格局，日經指數上漲2.28%再創高點，韓股小幅上揚0.07%，港股上漲0.58%，上證指數則小漲0.13%，區域市場受到科技股反彈帶動氣氛轉暖。 回到台股，在美股科技股領漲激勵下，加權指數大漲668.35點、收33,072.97點，成交金額6,576.52億元，成功站上33,000點並改寫歷史新高。權王台積電(2330)強漲65元刷新天花板價推升指數，資金明顯集中於大型電子權值股；AI伺服器與先進封裝題材持續發酵，而部分記憶體與高檔個股則出現整理，顯示盤面呈現「權值強、中小型股分歧」的輪動格局。
