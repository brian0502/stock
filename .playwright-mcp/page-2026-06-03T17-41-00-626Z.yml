                      - text: 奇鋐首季大賺2個股本 估今年營運逐季成長
                  - paragraph [ref=e550]: （中央社記者曾仁凱台北2026年5月14日電）散熱大廠奇鋐(3017)今天舉行法人說明會，公布第1季財報，歸屬母公司淨利新台幣79.16億元，季增19.29%，比去年同期大幅成長1.46倍，續創單季獲利新高，每股純益20.17元，單季賺進2個股本。奇鋐財務長陳易成今天表示，隨著許多新專案陸續出貨，奇鋐營收、獲利維持今年「逐季成長」的看法不變，下半年表現會優於上半年。奇鋐首季營收490.38億元，季增2.64%，年增110.17%；毛利率29.77%，季增3.38個百分點，年增3.94個百分點，全部創下歷史新高。陳易成表示，營運強勁成長主要是隨著AI資料中心大量導入液冷散熱，帶動奇鋐相關業務高速成長。以第1季為例，伺服器相關產品占營收比重已經攀升到66.4%，較去年第4季53.58%及去年同期45.48%明顯成長。展望後勢，奇鋐表示，不管是輝達（NVIDIA）的GPU，或是TPU、LPU及通用型的CPU，隨著現在系統設計愈來愈複雜，功率瓦數愈來愈高，接下來都會陸續導入液冷散熱技術，需求只會愈來愈大，而奇鋐位在這波AI浪潮的最前線，有望持續受惠。至於近期市場傳出輝達Vera Rubin G
