                  - heading "奇鋐今年資本支出估逾150億元 築高規模護城河" [level=3] [ref=e779]:
                    - link "奇鋐今年資本支出估逾150億元 築高規模護城河" [ref=e780] [cursor=pointer]:
                      - /url: https://tw.stock.yahoo.com/news/%E5%A5%87%E9%8B%90%E4%BB%8A%E5%B9%B4%E8%B3%87%E6%9C%AC%E6%94%AF%E5%87%BA%E4%BC%B0%E9%80%BE150%E5%84%84%E5%85%83-%E7%AF%89%E9%AB%98%E8%A6%8F%E6%A8%A1%E8%AD%B7%E5%9F%8E%E6%B2%B3-080959454.html
                      - text: 奇鋐今年資本支出估逾150億元 築高規模護城河
                  - paragraph [ref=e782]: （中央社記者曾仁凱台北2026年4月21日電）散熱大廠奇鋐(3017)今天參加由台灣證券交易所舉辦的業績說明會，重申2025年是奇鋐的液冷散熱元年，公司營收首度突破新台幣千億元大關，並表示2026年將投入資本支出150億元以上，持續築高規模護城河，擴大領先優勢。奇鋐財務部資深經理陳彥良今天在法說會中回顧，奇鋐一開始由鋁擠領域跨入散熱市場，之後引進日本古河電工參與投資，補足交換熱管技術，並陸續併購風扇廠與機殼廠，逐漸從單一元件廠走到系統級的散熱廠。尤其在液冷散熱方面，陳彥良表示，早期PC、網通只需要用到風冷散熱就好，但奇鋐超前部署，投資液冷技術研發，歷經10年無獲利，如今隨著AI伺服器應用落地，終於開花結果。陳彥良表示，2025年是奇鋐的液冷散熱元年，公司年度營收1396.39億元，年增率高達94.59%，規模首度衝破千億元大關，而且AI伺服器客戶占公司營收比重達一半以上。陳彥良認為，千億營收成為奇鋐重要的規模護城河，因為現階段，要拿到大型CSP（雲端服務供應商）的訂單，首先要有足夠產能，而奇鋐挾規模優勢大舉擴產，預計今年將投入資本支出150億元以上，明年還會更高，希望持續擴大領先優勢。
