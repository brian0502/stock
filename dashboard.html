<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資組合 Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17; --surface: #111827; --surface2: #1a2236; --border: #1e2d4a;
  --text: #e2e8f0; --text-dim: #64748b;
  --green: #10b981; --green-bg: rgba(16,185,129,.1);
  --red: #ef4444; --red-bg: rgba(239,68,68,.1);
  --blue: #3b82f6; --blue-bg: rgba(59,130,246,.1);
  --amber: #f59e0b; --amber-bg: rgba(245,158,11,.1);
  --purple: #8b5cf6; --purple-bg: rgba(139,92,246,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.mono{font-family:'JetBrains Mono',monospace}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
header h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.last-updated{color:var(--text-dim);font-size:13px}

/* Hero - Total */
.hero{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.08));border:1px solid rgba(139,92,246,.2);border-radius:16px;padding:28px 32px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.hero-left .hero-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.hero-left .hero-value{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700}
.hero-right{display:flex;gap:32px}
.hero-stat .hs-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.hero-stat .hs-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700}

/* Section divider */
.market-section{margin-bottom:36px}
.market-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.market-header h2{font-size:20px;font-weight:700}
.market-header .mh-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.mh-tw{background:var(--amber-bg);color:var(--amber)}
.mh-us{background:var(--blue-bg);color:var(--blue)}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.summary-card.c-amber::before{background:var(--amber)}
.summary-card.c-blue::before{background:var(--blue)}
.summary-card.c-green::before{background:var(--green)}
.summary-card.c-red::before{background:var(--red)}
.summary-card.c-purple::before{background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.summary-card .value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700}
.summary-card .sub{font-size:12px;margin-top:3px;color:var(--text-dim)}

.section-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-tw{background:var(--amber-bg);color:var(--amber)}
.badge-us{background:var(--blue-bg);color:var(--blue)}

.table-container{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:28px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);background:var(--surface2);border-bottom:1px solid var(--border);font-weight:500}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

.symbol-cell{display:flex;align-items:center;gap:10px}
.symbol-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#fff}
.symbol-name{font-weight:500;font-size:13px}
.symbol-code{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.positive{color:var(--green)}.negative{color:var(--red)}
.pnl-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:600}
.pnl-badge.positive{background:var(--green-bg)}.pnl-badge.negative{background:var(--red-bg)}
.bar-container{width:70px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}

.alloc-chart{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 6px}
.alloc-segment{position:relative}
.alloc-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-dim)}
.alloc-legend-item{display:flex;align-items:center;gap:5px}
.alloc-dot{width:7px;height:7px;border-radius:2px}

/* Transaction controls */
.tx-controls{display:flex;gap:10px;padding:14px;align-items:center;flex-wrap:wrap}
.tx-search{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;width:200px}
.tx-search:focus{border-color:var(--blue)}
.tx-search::placeholder{color:var(--text-dim)}
.tx-filter-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .15s}
.tx-filter-btn:hover,.tx-filter-btn.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.tx-page-info{color:var(--text-dim);font-size:12px;margin-left:auto;font-family:'JetBrains Mono',monospace}
.tx-page-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text);font-size:12px;cursor:pointer}
.tx-page-btn:hover{border-color:var(--blue)}
.tx-page-btn:disabled{opacity:.3;cursor:default}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:600}
.tag-buy{background:var(--green-bg);color:var(--green)}
.tag-sell{background:var(--red-bg);color:var(--red)}

.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:22px;padding-left:24px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-24px;top:4px;width:16px;height:16px;border-radius:50%;border:3px solid var(--bg)}
.dot-setup{background:var(--blue)}.dot-review{background:var(--amber)}.dot-trade{background:var(--green)}
.timeline-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:3px}
.timeline-title{font-weight:700;font-size:14px;margin-bottom:4px}
.timeline-detail{font-size:12px;color:var(--text-dim);line-height:1.5}

.footer-note{text-align:center;color:var(--text-dim);font-size:11px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}

@media(max-width:768px){
  body{padding:14px}
  .hero{padding:20px;flex-direction:column;align-items:flex-start}
  .hero-left .hero-value{font-size:28px}
  .hero-right{flex-wrap:wrap;gap:16px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .tx-controls{flex-direction:column;align-items:stretch}
  .tx-search{width:100%}
  .tx-page-info{margin-left:0}
  .cal-grid{grid-template-columns:1fr !important}
}

/* Calendar */
.cal-section{margin-bottom:32px}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cal-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden;transition:border-color .15s}
.cal-item:hover{border-color:rgba(255,255,255,.12)}
.cal-item.cal-past{opacity:.45}
.cal-item.cal-today{border-color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.15)}
.cal-date-col{display:flex;flex-direction:column;align-items:center;min-width:42px;padding-top:2px}
.cal-month{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.cal-day{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1.1}
.cal-dow{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.cal-info{flex:1;min-width:0}
.cal-title{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.3}
.cal-desc{font-size:11px;color:var(--text-dim);line-height:1.4}
.cal-stars{display:flex;gap:1px;margin-top:4px}
.cal-star{width:10px;height:10px;border-radius:2px}
.cal-star.on{background:var(--amber)}
.cal-star.off{background:var(--surface2)}
.cal-tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-right:4px;vertical-align:middle}
.cal-tag-geo{background:rgba(239,68,68,.15);color:#f87171}
.cal-tag-macro{background:rgba(59,130,246,.15);color:#60a5fa}
.cal-tag-earn{background:rgba(16,185,129,.15);color:#34d399}
.cal-tag-div{background:rgba(251,146,60,.15);color:#fb923c}
.cal-tag-event{background:rgba(139,92,246,.15);color:#a78bfa}

/* Realized PnL Modal */
.realized-card{cursor:pointer;transition:all .15s}
.realized-card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
.realized-hint{font-size:11px;color:var(--text-dim);margin-top:5px;display:flex;align-items:center;gap:4px}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.modal-close:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.modal-body{padding:16px 24px 24px;overflow-y:auto;flex:1}
.modal-total{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface2);border-radius:10px;margin-bottom:16px}
.modal-total-label{font-size:12px;color:var(--text-dim)}
.modal-total-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700}

.stock-group{margin-bottom:18px}
.stock-group:last-child{margin-bottom:0}
.sg-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none}
.sg-symbol{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px}
.sg-name{font-size:12px;color:var(--text-dim);margin-left:8px;font-weight:400}
.sg-pnl{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}
.sg-trades{border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden}
.sg-trade{display:grid;grid-template-columns:72px 46px 1fr auto auto;align-items:center;gap:8px;padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03)}
.sg-trade:last-child{border-bottom:none}
.sg-trade:hover{background:rgba(255,255,255,.015)}
.sg-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
.sg-action{font-size:10px;padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:600;text-align:center}
.sg-action.buy{background:var(--green-bg);color:var(--green)}
.sg-action.sell{background:var(--red-bg);color:var(--red)}
.sg-desc{font-size:12px;color:var(--text)}
.sg-amount{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;color:var(--text-dim)}

@media(max-width:640px){
  .modal{max-width:100%;max-height:90vh;border-radius:12px}
  .sg-trade{grid-template-columns:60px 40px 1fr auto;font-size:11px}
  .sg-amount{display:none}
}
</style>
</head>

    <tbody id="twTableBody"></tbody></table>
  </div>
</div>

<!-- US Section -->
<div class="market-section">

  <div class="summary-grid" id="usSummary"></div>
  <div class="table-container" style="margin-bottom:10px">

      <div style="font-size:11px;color:var(--text-dim)">資產配置</div>
      <div class="alloc-chart" id="usAllocChart"></div>
      <div class="alloc-legend" id="usAllocLegend"></div>
    </div>
  </div>
  <div class="table-container">
    <table><thead><tr><th>標的</th><th>持股</th><th style="text-align:right">均價</th><th style="text-align:right">現價</th><th style="text-align:right">市值</th><th style="text-align:right">損益</th><th>佔比</th></tr></thead>
    <tbody id="usTableBody"></tbody></table>
  </div>
</div>

<!-- Transaction History -->
<div class="section-title" style="margin-top:8px">📋 交易紀錄</div>
<div class="table-container">
  <div class="tx-controls">
    <input type="text" class="tx-search" id="txSearch" placeholder="搜尋標的代號 (e.g. NVDA)">
    <button class="tx-filter-btn active" data-filter="all" onclick="setTxFilter('all',this)">全部</button>
    <button class="tx-filter-btn" data-filter="buy" onclick="setTxFilter('buy',this)">買入</button>
    <button class="tx-filter-btn" data-filter="sell" onclick="setTxFilter('sell',this)">賣出</button>
    <button class="tx-filter-btn" data-filter="us" onclick="setTxFilter('us',this)">美股</button>
    <button class="tx-filter-btn" data-filter="tw" onclick="setTxFilter('tw',this)">台股</button>
    <span class="tx-page-info" id="txPageInfo"></span>
    <button class="tx-page-btn" id="txPrev" onclick="txChangePage(-1)">← 上一頁</button>
    <button class="tx-page-btn" id="txNext" onclick="txChangePage(1)">下一頁 →</button>
  </div>
  <table>
    <thead><tr><th>日期</th><th>市場</th><th>標的</th><th>動作</th><th style="text-align:right">股數</th><th style="text-align:right">價格</th><th style="text-align:right">金額</th><th>備註</th></tr></thead>
    <tbody id="txBody"></tbody>
  </table>
</div>

<!-- Adjustment Timeline -->
<div class="section-title" style="margin-top:8px">🔄 組合調整紀錄</div>
<div class="table-container" style="padding:20px"><div class="timeline" id="timeline"></div></div>

<!-- Reports -->
<div class="section-title" style="margin-top:8px">📄 分析報告</div>
<div class="table-container">
  <table><thead><tr><th>日期</th><th>類型</th><th>報告標題</th><th>重點摘要</th><th>連結</th></tr></thead>
  <tbody id="reportsBody"></tbody></table>
</div>

<!-- Realized PnL Modal -->
<div class="modal-overlay" id="realizedModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

// ===== CALENDAR =====
const TODAY = '2026-04-27';
const DOW_MAP = ['日','一','二','三','四','五','六'];
// ===== CALENDAR (month tabs) =====
const CAL_MONTH_NAMES = ['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const CAL_TAG_LABEL = {geo:'地緣',macro:'總經',earn:'財報',div:'配息',event:'事件'};
let calActiveMonth = '';

function renderCalendar(){
  // Build month list: chronological order (oldest left → newest right)
  const orderedMonths = [...new Set(calendarEvents.map(ev => ev.date.slice(0,7)))].sort();

  // Default to current month, or closest upcoming month
  if(!calActiveMonth || !orderedMonths.includes(calActiveMonth)){
    const cur = TODAY.slice(0,7);
    calActiveMonth = orderedMonths.find(m => m >= cur) || orderedMonths[orderedMonths.length-1] || '';
  }

  // Render tab buttons
  const tabsEl = document.getElementById('calTabs');
  tabsEl.innerHTML = orderedMonths.map(m => {
    const [y,mo] = m.split('-');
    const label = y + '年' + CAL_MONTH_NAMES[parseInt(mo)];
    const isFuture = m >= TODAY.slice(0,7);
    const isActive = m === calActiveMonth;
    const dot = isFuture ? '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:5px;vertical-align:middle"></span>' : '';
    const style = isActive
      ? 'background:var(--blue-bg);border:1px solid var(--blue);color:var(--blue)'
      : 'background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)';
    return `<button style="${style};border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;transition:all .15s" onclick="setCalMonth('${m}')">${dot}${label}</button>`;
  }).join('');

  // Render events for active month
  const evs = calendarEvents
    .filter(ev => ev.date.slice(0,7) === calActiveMonth)
    .sort((a,b) => b.date.localeCompare(a.date));

  document.getElementById('calGrid').innerHTML = evs.map(ev => {
    const d = new Date(ev.date + 'T00:00:00');
    const mon = CAL_MONTH_NAMES[d.getMonth()+1];
    const day = d.getDate().toString();
    const dow = DOW_MAP[d.getDay()];
    const isPast = ev.date < TODAY;
    const isToday = ev.date === TODAY;
    const stars = Array.from({length:5},(_,i)=>`<div class="cal-star ${i<ev.stars?'on':'off'}"></div>`).join('');
    return `<div class="cal-item${isPast?' cal-past':''}${isToday?' cal-today':''}">
      <div class="cal-date-col"><div class="cal-month">${mon}</div><div class="cal-day">${day}</div><div class="cal-dow">週${dow}</div></div>
      <div class="cal-info"><div class="cal-title"><span class="cal-tag cal-tag-${ev.tag}">${CAL_TAG_LABEL[ev.tag]||''}</span>${ev.title}</div><div class="cal-desc">${ev.desc}</div><div class="cal-stars">${stars}</div></div>
    </div>`;
  }).join('') || '<div style="padding:20px;color:var(--text-dim);font-size:13px">本月無事件</div>';
}

function setCalMonth(month){
  calActiveMonth = month;
  renderCalendar();
}

let txFilter = 'all', txSearchStr = '', txPage = 0;
const TX_PER_PAGE = 10;

function getFilteredTx(){
  return allTx.filter(t=>{
    if(txFilter==='buy' && t.action!=='buy') return false;
    if(txFilter==='sell' && t.action!=='sell') return false;
    if(txFilter==='us' && t.market!=='US') return false;
    if(txFilter==='tw' && t.market!=='TW') return false;
    if(txSearchStr && !t.symbol.toLowerCase().includes(txSearchStr.toLowerCase())) return false;
    return true;
  });
}

function renderTx(){
  const filtered = getFilteredTx();
  const totalPages = Math.max(1,Math.ceil(filtered.length/TX_PER_PAGE));
  if(txPage >= totalPages) txPage = totalPages-1;
  if(txPage < 0) txPage = 0;
  const start = txPage*TX_PER_PAGE;
  const page = filtered.slice(start,start+TX_PER_PAGE);
  const cur = t => t.market==='TW'?'NT$':'$';

  document.getElementById('txBody').innerHTML = page.length ? page.map(t=>`<tr>
    <td class="mono">${t.date}</td>
    <td><span class="badge ${t.market==='TW'?'badge-tw':'badge-us'}">${t.market==='TW'?'台股':'美股'}</span></td>
    <td><strong>${t.symbol}</strong></td>

    <td class="mono" style="text-align:right">${cur(t)}${fmt(t.amount,2)}</td>

function openModal(market){
  const isUS = market === 'us';
  const data = isUS ? usRealizedDetail : twRealizedDetail;
  const cur = isUS ? '$' : 'NT$';
  const totalPnl = isUS ? usRealizedPnl : twRealizedPnl;
  const title = isUS ? '🇺🇸 美股已實現損益明細' : '🇹🇼 台股已實現損益明細';
  const d = isUS ? 2 : 0;

  document.getElementById('modalTitle').textContent = title;

  const totalHtml = `<div class="modal-total">
    <div class="modal-total-label">合計已實現損益（${data.length} 檔）</div>
    <div class="modal-total-value ${pc(totalPnl)}">${totalPnl>=0?'+':''}${cur}${fmt(totalPnl,d)}</div>
  </div>`;

  const groupsHtml = data.map(stock => {
    const tradesHtml = stock.trades.map(t =>
      `<div class="sg-trade">
        <div class="sg-date">${t.date}</div>
        <div class="sg-action ${t.action}">${t.action==='buy'?'買入':'賣出'}</div>
        <div class="sg-desc">${t.desc}</div>
        <div class="sg-amount">${cur}${fmt(t.amount,d)}</div>
      </div>`
    ).join('');

    return `<div class="stock-group">
      <div class="sg-header">
        <div><span class="sg-symbol">${stock.symbol}</span><span class="sg-name">${stock.name}</span></div>
        <div class="sg-pnl ${pc(stock.pnl)}">${stock.pnl>=0?'+':''}${cur}${fmt(stock.pnl,d)}</div>
      </div>
      <div class="sg-trades">${tradesHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('modalBody').innerHTML = totalHtml + groupsHtml;
  document.getElementById('realizedModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('realizedModal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
</script>
