<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持股明細 ｜ Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="holdings">
<nav id="topNav"></nav>
<div class="page-title">💼 持股明細</div>
<div class="market-section">
  <div class="market-header"><h2>🇹🇼 台股</h2><span class="mh-badge mh-tw">TWSE</span></div>
  <div class="summary-grid" id="twSummary"></div>
  <div class="table-container" style="margin-bottom:10px">
    <div style="padding:14px 14px 4px">
      <div style="font-size:11px;color:var(--text-dim)">資產配置</div>
      <div class="alloc-chart" id="twAllocChart"></div>
      <div class="alloc-legend" id="twAllocLegend"></div>
    </div>
  </div>
  <div class="table-container">
    <table><thead><tr><th>標的</th><th>持股</th><th style="text-align:right">均價</th><th style="text-align:right">現價</th><th style="text-align:right">市值</th><th style="text-align:right">損益</th><th>佔比</th></tr></thead>
    <tbody id="twTableBody"></tbody></table>
  </div>
</div>
<div class="market-section">
  <div class="market-header"><h2>🇺🇸 美股</h2><span class="mh-badge mh-us">US</span></div>
  <div class="summary-grid" id="usSummary"></div>
  <div class="table-container" style="margin-bottom:10px">
    <div style="padding:14px 14px 4px">
      <div style="font-size:11px;color:var(--text-dim)">資產配置</div>
      <div class="alloc-chart" id="usAllocChart"></div>
      <div class="alloc-legend" id="usAllocLegend"></div>
    </div>
  </div>
  <div class="table-container">
    <table><thead><tr><th>標的</th><th>持股</th><th style="text-align:right">均價</th><th style="text-align:right">現價</th><th style="text-align:right">市值</th><th style="text-align:right">損益</th><th>佔比</th></tr></thead>
    <tbody id="usTableBody"></tbody></table>
  </div>
</div>
<div class="modal-overlay" id="realizedModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="footer-note">⚠️ 本頁面僅供個人投資追蹤，不構成投資建議。現價為手動更新，非即時報價。</div>
<script>document.write('<script src="data.js?t=' + Date.now() + '"><\/script>')</script><!-- data.js 一律帶時間戳載入＝強制繞過瀏覽器/CDN 快取（2026-08-14 根治：用戶更新後看到舊 actionBoard） -->
<script src="app.js"></script>
</body>
</html>
